cross_squad:
  - squad: page-forge
    trigger: "page-builder-coordinator precisa construir pagina"
    agents_used: [iris]
  - squad: copy-squad
    trigger: "copy profundo ou especializado"
    agents_used: [copy-chief, gary-halbert, eugene-schwartz]
  - squad: ads
    trigger: "execucao de trafego pago"
    agents_used: [bolt]
  - squad: storytelling
    trigger: "arco narrativo profundo ou pitch script"
    agents_used: [story-chief, oren-klaff]

settings:
  activation:
    prefix: "launch-paid"
    example: "@launch-paid:launch-chief"
  methodology:
    source: "ebook_lancamento_pago_baldan.md"
    rules:
      - "Promessa com formula: tempo curto + acao pratica + entrega visivel"
      - "Verbos proibidos: aprender, descobrir, faturar, desbloquear, conquistar, segredos"
      - "Evento 2 dias: 80% conteudo, 20% pitch"
      - "Pitch em 3 etapas: ancoragem (D1 10:30), oferta (D2 11:30), abertura (D2 16:40)"
      - "Conteudo retorna APOS pitch final (regra de ouro)"
      - "Ingresso R$19-49 como qualificador, nao como lucro"
      - "Comercial pos-pitch: ate 11 toques, cada um com razao nova"
      - "Bonus escalonados que respondem objecoes reais"
      - "Single Shot remarketing: aparece uma vez, depois acaba"
      - "Lembrete inteligente: beneficio, nao contagem regressiva"
      - "Modelo simples vence modelo complexo"
