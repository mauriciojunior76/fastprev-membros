# ═══════════════════════════════════════════════════════════════════
# Squad: Launch Paid (Lancamento Pago)
# Domain: Lancamento Pago - Metodologia Baldan
# Version: 1.0.0
# ═══════════════════════════════════════════════════════════════════

squad:
  name: launch-paid
  display_name: "Launch Paid Squad"
  version: "1.0.0"
  domain: "Lancamento pago - ingresso barato, evento 2 dias, pitch 3 etapas, conversao e recuperacao comercial"
  description: |
    Squad de 41 agentes especializados na metodologia de lancamento pago (Baldan).
    Pipeline completo: pesquisa > promessa > copy > evento > criativos > comercial > metricas.
    Cada agente domina uma etapa especifica do metodo com frameworks extraidos do documento-base.
  keywords: [lancamento-pago, paid-launch, evento-pago, ingresso, pitch, conversao, trafego, comercial, metricas, oferta, baldan]
  entry_agent: launch-chief
  created_at: "2026-03-28"

tiers:
  tier_0:
    name: "Comando Central"
    agents: [launch-chief, launch-deputy]
    purpose: "Orquestracao do pipeline completo, routing entre tiers, quality gate final, compliance com metodologia"
  tier_1a:
    name: "Estrategia e Promessa"
    agents: [researcher, promise-architect, big-idea-specialist, narrative-analyst, strategic-planner]
    purpose: "Pesquisa de mercado, criacao da promessa central, Big Idea, arco narrativo e planejamento macro"
  tier_1b:
    name: "Copy e Linguagem"
    agents: [headline-specialist, page-copy-specialist, email-specialist, whatsapp-specialist, ad-copy-specialist, copy-reviewer]
    purpose: "Copy de pagina (12 secoes), headlines, emails, WhatsApp, anuncios C0-C4, revisao de copy"
  tier_1c:
    name: "Evento e Conteudo"
    agents: [event-architect, pitch-organizer, subject-organizer, subject-expert, seeding-specialist, event-reviewer]
    purpose: "Estrutura do evento 2 dias, pitch 3 etapas, organizacao de assuntos, seeding, conteudo mao na massa"
  tier_1d:
    name: "Trafego e Criativos"
    agents: [creative-planner, creative-script-writer, remarketing-specialist, traffic-data-planner, creative-reviewer]
    purpose: "Plano tatico C0-C4, roteiros de criativos, remarketing Single Shot, dados de trafego, revisao"
  tier_1e:
    name: "Comercial e Pos-Pitch"
    agents: [commercial-strategist, bonus-architect, followup-specialist, recording-vip-specialist, live-post-pitch-specialist, commercial-reviewer]
    purpose: "Estrategia comercial pos-pitch, 11 toques por lead, bonus escalonados, follow-up, gravacoes, VIP, lives"
  tier_1f:
    name: "Metricas, Dados e Operacao"
    agents: [metrics-analyst, diagnostics-specialist, checklist-manager, crm-operations-specialist, team-operations-planner, decision-notebook-specialist]
    purpose: "KPIs, diagnostico por etapa, checklists operacionais, CRM, equipe, caderno de decisao diario"
  tier_1g:
    name: "Oferta e Produto"
    agents: [offer-architect, ticket-strategist, post-event-product-planner, upgrade-designer, page-builder-coordinator]
    purpose: "Arquitetura de oferta, ingresso/lotes, produto pos-evento, upgrades, coordenacao de paginas"

