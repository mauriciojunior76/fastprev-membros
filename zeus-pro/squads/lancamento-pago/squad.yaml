name: launch-paid
version: "2.0.0"
short-title: "Launch Paid Squad"
description: "Squad de 46 agentes especializados em lancamento pago (metodologia Baldan). Cobre briefing completo, planejamento mestre, promessa, copy, evento 2 dias, pitch 3 etapas, trafego C0-C4, comercial pos-pitch, metricas, oferta e operacao completa. Inclui barra de progresso Hotmart integrada."
author: "Synkra AIOS"
license: MIT
slashPrefix: "launch-paid"

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - lancamento-pago
  - paid-launch
  - evento-pago
  - ingresso
  - pitch
  - conversao
  - trafego
  - comercial
  - metricas
  - oferta
  - baldan

