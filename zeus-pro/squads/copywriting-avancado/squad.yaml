  - copy killer

lt_creative_gate:
  status: INVIOLAVEL
  origem: "o dono do canal 10/07/2026, refinado 12/07/2026 (vertical/horizontal)"
  description: >
    Todo criativo de produto LOW TICKET gerado por este squad obedece a
    ANATOMIA UNIVERSAL padrao Sofa Marrom (canonico:
    docs/rules-on-demand/low-ticket-creative-standard.md; Tier 0:
    .claude/rules/padrao-maxxima-low-ticket.md):
    1) TOPO CERTO (regra vertical/horizontal): produto VERTICAL (segmentado
    por profissao: psicologo, advogado, massoterapeuta) = profissao/area
    LITERAL na primeira linha do estatico ou nos 3 primeiros segundos do video;
    produto HORIZONTAL (profissao desconhecida: futuro mentor, futuro trader,
    empresario que quer usar IA) = topo carrega a DOR, o DESEJO ou o ASSUNTO
    da palavra-chave (mentoria, trade, IA). Sem NENHUM dos dois = REPROVADO
    no quality gate.
    2) ANATOMIA 4 CAMADAS, texto curto, nunca bloco longo: H1 agressivo focado
    na dor/desejo + H2 menor que justifica ou torna real + preco + CTA.
    3) PRECO fecha o bloco de leitura em produto baratinho (padrao Sofa Marrom),
    com o bloco inteiro dentro da area segura do formato.

