name: copy-master-edition
short_title: "Copy Master Edition"
folder: squads/copywriting-squad/   # pasta mantida pelo caminho historico, o NOME oficial e Copy Master Edition
description: >
  COPY MASTER EDITION: o squad unico de copy do o dono do canal, fonte unica desde 11/08/2026.
  36 agentes (22 lendas do direct response + 5 hook specialists + 8 agentes nucleo PT +
  1 orquestrador), 17 regras invioláveis (Lei da Ferida, Lei do Alvo e as tres da aula
  de 11/08: toda peca vende o encontro, incluso vai o que e o porque, custo da inacao
  em 4 camadas),
  12 frameworks, memoria viva de copies campeas com metrica real e quality gate com
  score 0-100. Substitui um departamento completo de copywriting. Ativa em QUALQUER
  peso: o peso dimensiona o time, nunca decide se as regras valem.
version: 2.3.0
author: "um mentor de referencia / Synkra AIOS"
license: PROPRIETARY

