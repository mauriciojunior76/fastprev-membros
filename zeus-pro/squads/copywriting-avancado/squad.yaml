      22 lendas do direct response (USA/UK). BIBLIOTECA DE CONSULTA desde 26/07/2026,
      nao executoras: o copy-chief indica qual lenda estudar para calibrar estilo e
      quem escreve e o nucleo Tier 1. Indice em data/biblioteca-lendas.md.
    papel: biblioteca_de_consulta
    count: 22
    sub_tiers:
      direct_response_legends:
        focus: "Long-form, print, mail, sales letter classica"
        agents:
          - gary-halbert
