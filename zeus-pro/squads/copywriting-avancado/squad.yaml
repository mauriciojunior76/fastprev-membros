        focus: "Email sequences, daily emails, nurture"
        agents:
          - ben-settle
          - andre-chaperon
          - dan-koe
      offers_sales_pages:
        focus: "Offer architecture, print ads, financial/health"
        agents:
          - joe-sugarman
          - david-ogilvy
          - clayton-makepeace
          - parris-lampropoulos
