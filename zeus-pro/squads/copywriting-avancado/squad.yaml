quality_gate:
  agent: copy-auditor
  minimum_score: 60
  max_iterations: 2
  threshold_by_weight:
    "0-40": 50
    "41-60": 60
    "61-80": 70
    "81-100": 80
  behavior_below_threshold: rewrite_internally

