global_rules:
  file: GLOBAL_COPY_RULES.md
  count: 10
  inviolable: true
  highlights:
    - "Nunca vender produto high ticket em frio"
    - "Preco minimo definido contratualmente nao aparece fragmentado em copy"
    - "Especificidade obrigatoria (3 de 6 ancoras)"
    - "Uma VMC por copy"
    - "Urgencia apenas quando real"
    - "Prova social verificavel"
    - "Ortografia perfeita / sem travessao"
    - "CTA unico"
    - "Publico definido antes do copy"
    - "Auditoria interna score >= 60"

