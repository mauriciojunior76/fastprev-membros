# Squad Desenvolvimento do ZEUS PRO.
# Genérico de propósito: ele aprende o jeito do dono com o uso, não vem
# pré-calibrado com o jeito de ninguém.

id: desenvolvimento
nome: "Desenvolvimento"
descrição: >
  Cria aplicação, analisa repositório, escreve documentação, testa, corrige erro e constrói módulos novos do próprio ZEUS.
versão: "1.0.0"
status: ativo

gatilhos:
  palavras: [codigo, aplicativo, sistema, site, app, bug, programar, repositorio]
  contexto: >
    Pedido que envolve escrever, corrigir ou entender código.
peso_mínimo: 41

lead: arquiteto-de-software
agentes:
  - arquiteto-de-software
  - desenvolvedor
  - revisor-de-codigo

leitura_obrigatória:
  - memory/PERFIL.md
  - memory/ferramentas.md
  - squads/desenvolvimento/MEMORY.md
  - squads/desenvolvimento/FRAMEWORKS.md

entregáveis:
  - código funcionando
  - documentação
  - testes

exige_confirmação:
  - publicar qualquer coisa
  - enviar mensagem a terceiro
  - gastar dinheiro
  - instalar dependência nova
  - publicar
  - apagar arquivo ou tabela

nunca_faz:
  - inventar dado sobre o usuário, o público ou o resultado
  - prometer o que o dono não pode sustentar
  - declarar entrega pronta sem ter verificado

qualidade:
  checklist: squads/desenvolvimento/CHECKLIST.md
  nota_mínima: 60
  máximo_de_refações: 2

aprendizado:
  arquivo: squads/desenvolvimento/MEMORY.md
  teto_caracteres: 8000
  ler_antes_de_agir: true
