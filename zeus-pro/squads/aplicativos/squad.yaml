# Manifesto de squad do ZEUS PRO.
# Copie esta pasta inteira para criar um squad novo.
# Campos marcados como obrigatorio nao podem faltar.

# ---- IDENTIDADE (obrigatorio) ----
id: aplicativos                   # kebab-case, igual ao nome da pasta
nome: "Squad Aplicativos"
descrição: >
  Cria aplicativo de verdade, do zero, que resolve um problema real e pode
  cobrar uma vez ou por assinatura. Cuida da CONSTRUCAO tecnica do app (PWA,
  hospedagem, banco de dados, pagamento, seguranca e entrega de acesso).
  Acionado quando o mentorado quer construir um SaaS, app de assinatura ou
  PWA a partir de uma dor real validada. Trabalha junto com o squad de baixo
  ticket, que cuida do metodo de venda do produto, nunca da construcao.
versão: "1.0.0"
status: ativo                     # ativo | rascunho | pausado

# ---- ROTEAMENTO (obrigatorio) ----
# Como o orquestrador decide chamar este squad.
gatilhos:
  palavras: [aplicativo, app, saas, pwa, assinatura, recorrencia, mensalidade, plataforma]
  contexto: >
    Mentorado quer construir um produto digital que roda como software (nao
    um arquivo estatico tipo ebook), que a pessoa usa de novo e de novo, com
    pagamento unico ou mensal. O contexto vence a palavra chave quando os
    dois discordarem: "app" falado como sinonimo de ebook ou pagina nao
    aciona este squad.
peso_mínimo: 41                   # abaixo disso o ZEUS responde sozinho

# ---- ELENCO ----
# Regra do ZEUS PRO: poucos agentes e bons. Lead mais 3 a 6.
lead: arquiteto-de-produto
agentes:
  - arquiteto-de-produto
  - validador-de-dor
  - construtor-pwa
  - especialista-pagamento-seguranca
  - revisor-entrega

# ---- O QUE ELE PRECISA LER ANTES DE AGIR ----
# Fontes de verdade. Sem isso o squad inventa.
leitura_obrigatória:
  - squads/aplicativos/GUIA-DO-APP.md
  - squads/aplicativos/MEMORY.md
  - squads/low-ticket-saas/knowledge/03-saas-recorrencia-app.md
  - memory/protocolo-app-recorrencia-felix.md
  - docs/rules-on-demand/crm-sistema-interface-shadcn.md

# ---- O QUE ELE ENTREGA ----
entregáveis:
  - briefing de app validado (dor, publico, antipersona, restricoes)
  - questionario de validacao de dor real
  - especificacao de MVP
  - aplicativo PWA instalavel, funcionando, hospedado
  - integracao de pagamento com entrega automatica de acesso
  - checklist de seguranca aplicado (sessao unica, teste de burla, LGPD)

# ---- LIMITES (obrigatorio) ----
# O que este squad NUNCA faz sozinho, mesmo com autonomia alta.
exige_confirmação:
  - publicar o app em producao para uso real
  - contratar ou pagar hospedagem, dominio ou gateway de pagamento
  - subir campanha de trafego para o app (isso e do squad de baixo ticket)
  - coletar dado pessoal de usuario sem definir antes onde e como fica guardado
nunca_faz:
  - construir app sem validar a dor real com pergunta feita a gente de verdade
  - prometer resultado financeiro especifico como garantia
  - copiar identidade visual, nome de marca ou design exato de app de terceiro
  - tratar a venda do app como problema tecnico quando o gargalo e comercial

# ---- QUALIDADE ----
qualidade:
  checklist: squads/aplicativos/GUIA-DO-APP.md
  nota_mínima: 60                 # 0 a 100
  máximo_de_refações: 2

# ---- APRENDIZADO (obrigatorio) ----
aprendizado:
  arquivo: squads/aplicativos/MEMORY.md
  teto_caracteres: 8000           # porque e injetado no contexto
  ler_antes_de_agir: true

# ---- PARCERIAS ----
# Quando falta capacidade, quem este squad chama.
parceiros:
  - squad: low-ticket
    quando: precisa montar oferta, pagina de vendas, criativo ou trafego para vender o app
  - squad: branding
    quando: precisa de decisao visual alem do funcional
  - squad: pesquisa
    quando: precisa de dado externo antes de afirmar viabilidade de mercado
