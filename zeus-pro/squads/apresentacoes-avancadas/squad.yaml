visual_tokens_default:
  palette: "tema Neutro (violeta profissional) como padrão, ou paleta extraída do material de referência do mentor"
  backgrounds: "dark principal + alternativo + card"
  fonts: "título 700-900, corpo 300-500"
  icons: "Tabler como padrão + Lucide/Phosphor como fallback"
  grain: "body::after feTurbulence opacity 0.3 (ativar conforme tema)"
  motion: "cubic-bezier(0.16, 1, 0.3, 1) ease-out suave"
  referencia: "mentor pode fornecer imagem ou PDF para extração automática de paleta pelo Reference Analyzer"

references:
  preludio_master: "../../clientes/zeus/preludio-claude-code/index.html"
  aula_master: "../../clientes/zeus/aula-claude-code-2/index.html"
  guia_master: "../../clientes/zeus/aula-criativos-lt/index.html"
  icones: "../../squads/iconografia/pipeline/data/exemplo-icon-library.md"

capabilities:
  onboarding_mentor: true
  memory_persistent: true
  multi_theme: true
  on_demand_orchestration: true
  external_images: true
  external_icons: true
  data_visualization: true
  accessibility_auditing: true
  auto_deploy_vps: true

deliverables:
  formats:
    preludio:
      duration: "30-60s por loop"
      slides: "5-8 slides curtos"
      navigation: "automática + manual + pausa"
    aula:
      duration: "15-45 minutos"
      slides: "10-30 slides detalhados"
      navigation: "seta, scroll, teclado"
    ebook:
      duration: "leitura livre"
      pages: "scroll infinito com nav fixa"

verification:
  gates:
    - spell-checker (acentuação perfeita)
    - brand-checker (tema aplicado)
    - contrast-checker (WCAG AA)
    - responsive-guard (375px sem overflow)
    - accessibility-auditor (navegação por teclado)
    - final-qa (14 pontos)
    - deploy-agent (HTTP 200)

# Autoaprendizado (squads-memory-sync, 2026-07-25)
learning:
  memory_file: MEMORY.md
  format: memoria-squad-v1
  global_log: memory/erros-aprendidos.md
  squad_tag: zeus-show
  read_before_acting: true
  max_chars: 8000
