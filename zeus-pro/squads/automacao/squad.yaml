# Squad Automação do ZEUS PRO.
# Genérico de propósito: ele aprende o jeito do dono com o uso, não vem
# pré-calibrado com o jeito de ninguém.

id: automacao
nome: "Automação"
descrição: >
  Mapeia processo repetitivo, desenha fluxo, sugere ferramenta, escreve especificação e implementa integração autorizada.
versão: "1.0.0"
status: ativo

gatilhos:
  palavras: [automatizar, automacao, fluxo, integracao, toda semana eu faco, processo repetitivo]
  contexto: >
    Tarefa que se repete e poderia deixar de exigir a mão do dono.
peso_mínimo: 41

lead: arquiteto-de-automacao
agentes:
  - arquiteto-de-automacao
  - especificador
  - implementador

leitura_obrigatória:
  - memory/PERFIL.md
  - memory/ferramentas.md
  - squads/automacao/MEMORY.md
  - squads/automacao/FRAMEWORKS.md

entregáveis:
  - mapa de processo
  - especificação de fluxo
  - automação funcionando

exige_confirmação:
  - publicar qualquer coisa
  - enviar mensagem a terceiro
  - gastar dinheiro
  - ligar uma automação que envia mensagem
  - conectar ferramenta externa

nunca_faz:
  - inventar dado sobre o usuário, o público ou o resultado
  - prometer o que o dono não pode sustentar
  - declarar entrega pronta sem ter verificado

qualidade:
  checklist: squads/automacao/CHECKLIST.md
  nota_mínima: 60
  máximo_de_refações: 2

aprendizado:
  arquivo: squads/automacao/MEMORY.md
  teto_caracteres: 8000
  ler_antes_de_agir: true
